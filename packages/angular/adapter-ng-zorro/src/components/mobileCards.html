<ng-template #spacer let-height="height" let-className="className">
  <li
    aria-hidden="true"
    [class]="className"
    style="display: block"
    [style.height.px]="height"
  ></li>
</ng-template>
<ng-template
  #checkbox
  let-attrs="attrs"
  let-label="label"
  let-className="className"
  let-rowId="rowId"
>
  <adapt-selection-checkbox [className]="className" [attrs]="attrs" />
</ng-template>
<ng-template
  #rowActions
  let-row="row"
  let-actions="actions"
  let-confirm="confirm"
  let-labels="labels"
  let-layout="layout"
  let-render="render"
  let-classNames="classNames"
>
  <adapt-row-actions
    [minTargetSize]="44"
    [row]="row"
    [actions]="actions"
    [confirm]="confirm"
    [labels]="labels"
    [layout]="layout"
    [render]="render"
    [classNames]="classNames"
  />
</ng-template>
<ng-template #card let-content="content">
  <nz-card nzSize="small">
    <ng-container *ngTemplateOutlet="content" />
  </nz-card>
</ng-template>
<ng-template
  #field
  let-label="label"
  let-classes="classes"
  let-grid="grid"
  let-flash="flash"
  let-value="value"
  let-valueContext="valueContext"
  let-text="text"
>
  @if (grid) {
    <nz-descriptions
      nzSize="small"
      nzLayout="vertical"
      [nzColumn]="1"
      [nzColon]="false"
      data-adapttable-part="card-row"
      [style.grid-column]="label ? null : '1 / -1'"
      [attr.data-card-identity]="label ? null : ''"
      [class]="classes.cardRow"
    >
      <ng-template #fieldLabel>
        @if (label) {
          <span data-adapttable-part="card-label" [class]="classes.cardLabel">{{
            label
          }}</span>
        }
      </ng-template>
      <nz-descriptions-item [nzTitle]="fieldLabel">
        <span
          data-adapttable-part="card-value"
          [class]="classes.cardValue"
          [attr.data-flash]="flash"
        >
          <ng-container
            [ngTemplateOutlet]="value"
            [ngTemplateOutletContext]="valueContext"
          />
        </span>
      </nz-descriptions-item>
    </nz-descriptions>
  } @else {
    <nz-descriptions
      nzSize="small"
      [nzColumn]="1"
      [nzColon]="false"
      data-adapttable-part="card-row"
      [class]="classes.cardRow"
    >
      <ng-template #fieldLabel>
        @if (label) {
          <span data-adapttable-part="card-label" [class]="classes.cardLabel">{{
            label
          }}</span>
        }
      </ng-template>
      <nz-descriptions-item [nzTitle]="fieldLabel">
        <span data-adapttable-part="card-value" [class]="classes.cardValue">{{
          text
        }}</span>
      </nz-descriptions-item>
    </nz-descriptions>
  }
</ng-template>
<adapt-mobile-structure
  [view]="view()"
  [rowKey]="rowKey()"
  [maxHeight]="maxHeight()"
  [slots]="{
    spacer: spacer,
    checkbox: checkbox,
    rowActions: rowActions,
    card: card,
    field: field,
  }"
/>
