    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "AdaptTable",
        "description": "Headless, UI-agnostic React data table with native adapters for Mantine, MUI, Chakra UI, Ant Design, Radix and shadcn/ui — URL-synced state, declarative filters, column management, virtualization, i18n and RTL.",
        "url": "https://orwa-mahmoud.github.io/adapttable/",
        "applicationCategory": "DeveloperApplication",
        "operatingSystem": "Any",
        "license": "https://opensource.org/license/mit",
        "programmingLanguage": "TypeScript",
        "codeRepository": "https://github.com/orwa-mahmoud/adapttable",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>
    <!-- Cloudflare Web Analytics — cookieless, no consent banner needed. -->
    <script
      defer
      src="https://static.cloudflareinsights.com/beacon.min.js"
      data-cf-beacon='{"token": "dd71ff9f3b7b4064969d3f81e8c6ee9b"}'
    ></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Critical UI face first; mono + Arabic load after first paint. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media = 'all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <title>AdaptTable — one headless engine, every UI kit</title>
    <script>
      // Apply the stored theme before paint so page-to-page navigation
      // doesn't flash light.
      try {
        if (localStorage.getItem("adapttable-demo-theme") === "dark")
          document.documentElement.dataset.theme = "dark";
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
