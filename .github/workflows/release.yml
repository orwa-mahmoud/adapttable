name: Release

on:
  push:
    branches: [main]
  # Manual recovery when GitHub drops a push event.
  workflow_dispatch:

concurrency: release-${{ github.ref }}

# Nothing at this level: a token declared here reaches every job, including
# ones that only read. Each job below asks for what it needs.
permissions: {}

jobs:
  detect:
    name: Detect
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      needVersion: ${{ steps.flags.outputs.needVersion }}
      needPublish: ${{ steps.flags.outputs.needPublish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: flags
        name: Classify version vs publish vs skip
        run: node scripts/release-detect.mjs >> "$GITHUB_OUTPUT"

  version:
    needs: detect
    if: ${{ needs.detect.outputs.needVersion == 'true' }}
    name: Version Packages PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Open or update the Version Packages PR
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          # Version only — publish is a separate OIDC job so changesets/action
          # never writes an npm _authToken that would shadow trusted publishing.
          version-script: pnpm version-packages
          # A fine-grained PAT scoped to this repository alone, with Contents
          # and Pull requests write and nothing else. Repository settings deny
          # the workflow token the ability to create pull requests, so this is
          # the identity that opens the "Version Packages" PR — and because it
          # is a real account, that PR runs the required checks.
          github-token: ${{ secrets.RELEASE_TOKEN }}
        env:
          # The version-bump commit must not run the husky gate on this
          # 2-core runner: CI enforces the same gate on every PR (including
          # the Version Packages PR), and the full suite inside a commit
          # hook starves past the 30s antd test budget.
          HUSKY: "0"

  publish:
    needs: detect
    if: ${{ needs.detect.outputs.needPublish == 'true' }}
    name: Publish
    runs-on: ubuntu-latest
    # contents: create tags and releases · id-token: npm OIDC trusted publishing.
    # Provenance is automatic when trusted publishing is configured on npm.
    permissions:
      contents: write
      id-token: write
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          # Registry URL without an auth token — npm CLI ≥ 11.5.1 exchanges
          # the GitHub OIDC token when a trusted publisher is configured.
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Require npm CLI for OIDC trusted publishing
        run: |
          npm install -g npm@^11.5.1
          node -e "
            const v = require('child_process').execSync('npm -v',{encoding:'utf8'}).trim();
            const [maj, min, pat] = v.split('.').map(Number);
            if (maj < 11 || (maj === 11 && (min < 5 || (min === 5 && pat < 1)))) {
              console.error('npm >= 11.5.1 required for trusted publishing, got', v);
              process.exit(1);
            }
            console.log('npm', v, 'ok for OIDC');
          "

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Clear any registry auth that would shadow OIDC
        run: |
          # setup-node / prior steps must not leave a bearer token that makes
          # npm skip the OIDC exchange.
          npm config delete "//registry.npmjs.org/:_authToken" || true
          if [ -f .npmrc ]; then
            grep -v '_authToken' .npmrc > .npmrc.oidc || true
            mv .npmrc.oidc .npmrc
          fi
          unset NODE_AUTH_TOKEN
          unset NPM_TOKEN

      - name: Build, publint and publish
        # No NODE_AUTH_TOKEN / NPM_TOKEN — publish authenticates via OIDC.
        run: pnpm release:gated
        env:
          HUSKY: "0"

      - name: Create GitHub releases
        # One release per published package version, tagged on this commit,
        # with its CHANGELOG section as the notes.
        run: node scripts/github-releases.mjs
        env:
          GH_TOKEN: ${{ github.token }}
