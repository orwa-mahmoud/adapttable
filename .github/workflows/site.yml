name: Site

on:
  push:
    branches: [main]
    paths:
      - "apps/docs/**"
      - "apps/showcase/**"
      - "packages/**"
      - "docs/**"
      - "llms.txt"
      - "llms-full.txt"
      - "scripts/sitemap-routes.mjs"
      - "scripts/check-sitemap.mjs"
      - "scripts/build-llms-full.mjs"
      - "scripts/indexnow.mjs"
      - "scripts/indexnow-delta.mjs"
      - "scripts/build-showcase-html.mjs"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-pnpm
      - name: Build packages
        run: pnpm -r --filter './packages/*' build
      - name: Build docs site
        run: pnpm --filter @adapttable/docs build
      - name: Build live demo (showcase) under /demo
        run: pnpm --filter @adapttable/showcase build
      - name: Compose site
        run: |
          mkdir -p apps/docs/dist/demo
          cp -R apps/showcase/dist/* apps/docs/dist/demo/
      - name: Check every demo route is in the sitemap
        run: pnpm check:sitemap
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/docs/dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: composed-site
          path: apps/docs/dist
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: composed-site
          path: apps/docs/dist
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .indexnow-state.json
          key: indexnow-${{ github.sha }}
          restore-keys: |
            indexnow-
      - name: Notify IndexNow of changed URLs
        run: node scripts/indexnow.mjs --dist apps/docs/dist --state .indexnow-state.json
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always()
        with:
          path: .indexnow-state.json
          key: indexnow-${{ github.sha }}
