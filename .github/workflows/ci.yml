name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual recovery when GitHub drops a push event.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format · Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Turborepo's task cache, persisted across CI runs: tasks whose
      # inputs (and dependencies' outputs) are unchanged restore instantly
      # instead of re-linting/re-testing untouched packages. Changing core
      # still re-verifies every adapter — the hash includes dependency
      # outputs, so "new code breaks an old test" is always caught.
      - name: Restore Turborepo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Lint root tooling
        run: pnpm lint:root

      - name: Typecheck
        run: pnpm typecheck

      - name: Test with coverage
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

      - name: Validate published package configs
        run: pnpm publint

  # Every package promises `react: ^18 || ^19`, but the workspace develops on
  # one React version — this job proves the packed build actually runs (render,
  # sort, page, search, server-tier fetch) on each supported release line.
  react-matrix:
    name: React ${{ matrix.react }} compatibility
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        react: ["18.3.1", "19.0.0", "19.2.7"]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the probed packages
        run: pnpm turbo run build --filter=@adapttable/unstyled...

      - name: Smoke-test against React ${{ matrix.react }}
        run: pnpm react:matrix ${{ matrix.react }}
