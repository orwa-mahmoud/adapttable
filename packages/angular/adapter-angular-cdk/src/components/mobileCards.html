<ng-template #spacer let-height="height" let-className="className">
  <li
    data-adapttable-part="virtual-spacer"
    [class]="className"
    style="display: block"
    [style.height.px]="height"
  ></li>
</ng-template>
<ng-template
  #checkbox
  let-attrs="attrs"
  let-label="label"
  let-className="className"
  let-rowId="rowId"
>
  <label
    style="
      display: inline-flex;
      min-width: 44px;
      min-height: 44px;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    "
  >
    <input
      [attr.aria-label]="label"
      cdkMonitorElementFocus
      data-adapttable-cdk-control
      data-adapttable-part="checkbox"
      [class]="className"
      [adaptAttrs]="attrs"
    />
  </label>
</ng-template>
<ng-template
  #rowActions
  let-row="row"
  let-actions="actions"
  let-confirm="confirm"
  let-labels="labels"
  let-layout="layout"
  let-render="render"
  let-classNames="classNames"
>
  <adapt-row-actions
    [minTargetSize]="44"
    [row]="row"
    [actions]="actions"
    [confirm]="confirm"
    [labels]="labels"
    [layout]="layout"
    [render]="render"
    [classNames]="classNames"
  />
</ng-template>
<adapt-mobile-structure
  [view]="view()"
  [rowKey]="rowKey()"
  [maxHeight]="maxHeight()"
  [slots]="{
    spacer: spacer,
    checkbox: checkbox,
    rowActions: rowActions,
  }"
/>
