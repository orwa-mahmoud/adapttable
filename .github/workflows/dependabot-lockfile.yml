name: Dependabot lockfile

# Dependabot regenerates pnpm-lock.yaml with its own resolver, which re-resolves
# packages the update never touched and can leave two copies of one package in
# the tree (two @types/react copies fail every React kit's typecheck). Each
# Dependabot pull request instead gets the lockfile this repository's pinned
# pnpm writes for the same manifests, committed back to its branch.
#
# The push uses RELEASE_TOKEN from the Dependabot secrets store, so the PR
# workflow runs on the regenerated commit. Dependabot runs read only that store.
on:
  pull_request:
    branches: [main]
    paths:
      - "**/package.json"
      - pnpm-lock.yaml
      - pnpm-workspace.yaml

concurrency:
  group: dependabot-lockfile-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lockfile:
    name: Regenerate lockfile
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.actor == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Require the push token
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::error::RELEASE_TOKEN is missing from the Dependabot secrets store."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.RELEASE_TOKEN }}

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # Resolution only: no package scripts run and nothing is linked.
      - name: Regenerate pnpm-lock.yaml
        run: pnpm install --lockfile-only --ignore-scripts

      - name: Commit the regenerated lockfile
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "pnpm-lock.yaml already matches pnpm $(pnpm --version)."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore(deps): regenerate pnpm-lock.yaml with pnpm $(pnpm --version)"
          git push origin "HEAD:$HEAD_REF"
