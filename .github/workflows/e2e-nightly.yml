name: E2E nightly

# Extra browsers, mobile viewport, axe (again, on those engines) and
# Chromium visual baselines. The per-PR gate stays Chromium-only in pr.yml.
on:
  schedule:
    # Daily, after the US evening — not on every PR.
    - cron: "17 4 * * *"
  workflow_dispatch:

# One run per ref: a new run supersedes the last on the same branch, and the
# scheduled run on main never cancels a run dispatched on another branch.
concurrency:
  group: e2e-nightly-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  showcase-build:
    name: Build the showcase
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-pnpm
      - name: Build
        run: pnpm turbo run build --filter=@adapttable/showcase
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: showcase-dist
          path: apps/showcase/dist/
          retention-days: 1

  nightly-browsers:
    name: Firefox / WebKit / Pixel 5
    needs: showcase-build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        project: [firefox, webkit, mobile-chrome]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-pnpm
      - uses: ./.github/actions/playwright-chromium
        with:
          browsers: ${{ matrix.project == 'mobile-chrome' && 'chromium' || matrix.project }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: showcase-dist
          path: apps/showcase/dist/
      - name: Run the nightly project
        run: pnpm exec playwright test --project=${{ matrix.project }}
        env:
          SHOWCASE_SKIP_BUILD: "1"
      - name: Upload report on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-nightly-${{ matrix.project }}
          path: playwright-report/
          retention-days: 7

  visual:
    name: Chromium visual baselines
    needs: showcase-build
    runs-on: ubuntu-latest
    # The image the Linux baselines are captured in (e2e/visual/README.md):
    # the same browser build and the same fonts, so a kit that draws with the
    # system font stack renders the pixels its baseline holds. Keep the tag on
    # the installed @playwright/test version.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-pnpm
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: showcase-dist
          path: apps/showcase/dist/
      - name: Compare visual baselines
        run: pnpm exec playwright test --project=chromium-visual
        env:
          SHOWCASE_SKIP_BUILD: "1"
      - name: Upload report on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-nightly-visual
          path: playwright-report/
          retention-days: 7
