name: Peers

# Weekly, NON-BLOCKING probe of each adapter against the oldest and newest major
# of its UI-kit peer range: install published packages, typecheck, then mount in
# jsdom and click sort. It never gates a PR — it surfaces a claimed-but-broken
# major before a user does. Findings upload as artifacts and open (or update)
# one tracking issue for a human to triage; ranges are never narrowed
# automatically.
on:
  schedule:
    - cron: "0 6 * * 1" # Mondays, 06:00 UTC
  workflow_dispatch:

concurrency:
  group: peer-matrix
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  peer-matrix:
    name: Kit peer-range compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # The script installs published adapters + kit majors into throwaway dirs
      # with npm, so no workspace install is needed.
      - name: Probe oldest + newest supported kit majors
        run: node scripts/peer-matrix.mjs

      - name: Upload summary
        if: ${{ always() && hashFiles('ai_docs/peer-matrix-summary.json') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: peer-matrix-summary
          path: ai_docs/peer-matrix-summary.json
          retention-days: 90

      - name: Upload findings (if any)
        if: ${{ hashFiles('ai_docs/peer-matrix-findings.md') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: peer-matrix-findings
          path: ai_docs/peer-matrix-findings.md
          retention-days: 30

      # One tracking issue, not one per failure: created on the first red run,
      # updated in place on later ones, closed by a human after triage. A green
      # run leaves a comment on the open issue instead of silently going quiet.
      - name: Open or update the tracking issue
        if: ${{ always() && hashFiles('ai_docs/peer-matrix-summary.json') != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="Peer matrix: failing compatibility cells"
          failed="$(node -p 'JSON.parse(require("fs").readFileSync("ai_docs/peer-matrix-summary.json","utf8")).failed')"
          existing="$(gh issue list --repo "${{ github.repository }}" --state open \
            --search "\"$title\" in:title" --json number --jq '.[0].number // empty')"
          if [ "$failed" = "0" ]; then
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --repo "${{ github.repository }}" \
                --body "The $(date -u +%F) scheduled run passed every cell. Close this issue if the underlying cause is confirmed fixed."
            fi
            exit 0
          fi
          body_file="$(mktemp)"
          {
            echo "The scheduled peer-matrix run on $(date -u +%F) has failing cells."
            echo
            echo '| Adapter | Kit major | Phase |'
            echo '| --- | --- | --- |'
            node -p '
              JSON.parse(require("fs").readFileSync("ai_docs/peer-matrix-summary.json","utf8"))
                .cells.filter(c => !c.ok)
                .map(c => `| ${c.adapter} | v${c.major} | ${c.phase} |`)
                .join("\n")'
            echo
            echo "Full output is in the run's \`peer-matrix-findings\` artifact:"
            echo "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo "Triage rules: verify before acting; never narrow a peer range reflexively."
          } > "$body_file"
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --repo "${{ github.repository }}" --body-file "$body_file"
            gh issue comment "$existing" --repo "${{ github.repository }}" \
              --body "Updated by the $(date -u +%F) scheduled run ($failed failing cell(s))."
          else
            gh issue create --repo "${{ github.repository }}" \
              --title "$title" --body-file "$body_file"
          fi
