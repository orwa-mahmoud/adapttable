# SonarQube / SonarCloud configuration for the AdaptTable monorepo.
#
# Local scan:
#   sonar-scanner -Dsonar.host.url=http://localhost:9000
#
# Coverage is read from each package's lcov report; run
# `pnpm test:coverage` before scanning to populate them.

sonar.projectKey=adapttable
sonar.projectName=AdaptTable
sonar.organization=adapttable

# Source + test layout across the workspace.
sonar.sources=packages
sonar.tests=packages
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/test-utils.tsx,**/*.test-utils.tsx
sonar.exclusions=**/dist/**,**/coverage/**,**/node_modules/**,**/*.config.*,reference/**,ai_docs/**,apps/**,examples/**

# TypeScript / JS coverage (lcov) — one report per package, globbed.
sonar.javascript.lcov.reportPaths=packages/shared/core/coverage/lcov.info,packages/react/react/coverage/lcov.info,packages/shared/ai/coverage/lcov.info,packages/react/ai-react/coverage/lcov.info,packages/shared/server/coverage/lcov.info,packages/shared/i18n/coverage/lcov.info,packages/shared/cli/coverage/lcov.info,packages/react/adapter-mantine/coverage/lcov.info,packages/react/adapter-mui/coverage/lcov.info,packages/react/adapter-chakra/coverage/lcov.info,packages/react/adapter-radix/coverage/lcov.info,packages/react/adapter-base-ui/coverage/lcov.info,packages/react/adapter-unstyled/coverage/lcov.info,packages/react/adapter-shadcn/coverage/lcov.info,packages/react/adapter-antd/coverage/lcov.info,packages/react/adapter-bootstrap/coverage/lcov.info

# Raise the Node bridge heap so the scan doesn't OOM on the larger
# adapter packages (mirrors the capacity-planning-web fix).
sonar.javascript.node.maxspace=4096

# Duplication: hold the bar near zero on unique logic. Exclude generated/
# test files, and adapter chrome/table shells — each kit re-implements the
# same render contract with different primitives (intentional near-clones;
# CPD otherwise spikes when a new kit is copied from a sibling adapter).
sonar.cpd.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/*.d.ts,**/vitest.setup.ts,**/index.ts,**/i18n/src/locales/*.ts,**/core/src/labels.ts,packages/react/adapter-*/src/components/**,packages/react/adapter-*/src/DataTable.tsx,packages/react/adapter-*/src/types.ts

# Coverage metric reflects product logic only. Exclude test files + test
# helpers, the CLI bin shell (an IO wrapper exercised via run()), barrel
# re-exports, and type-only modules (interfaces compile to nothing).
# The barrels are listed one by one rather than globbed: `packages/shared/server`
# keeps its whole parser in `src/index.ts`, and that file is measured.
sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx,**/test-utils.tsx,**/*.test-utils.tsx,**/vitest.setup.ts,packages/react/adapter-antd/src/index.ts,packages/react/adapter-base-ui/src/index.ts,packages/react/adapter-bootstrap/src/index.ts,packages/react/adapter-chakra/src/index.ts,packages/react/adapter-mantine/src/index.ts,packages/react/adapter-mui/src/index.ts,packages/react/adapter-radix/src/index.ts,packages/react/adapter-shadcn/src/index.ts,packages/react/adapter-unstyled/src/index.ts,packages/shared/ai/src/index.ts,packages/react/ai-react/src/index.ts,packages/shared/cli/src/index.ts,packages/shared/core/src/index.ts,packages/shared/i18n/src/index.ts,packages/react/react/src/index.ts,packages/shared/cli/src/cli.ts,packages/shared/core/src/types.ts,packages/shared/core/src/source/TableSource.ts,packages/shared/core/src/columnModel.ts,packages/shared/core/src/display.ts,packages/shared/core/src/tableStateMutators.ts,packages/react/react/src/internal/chromeTestSlots.tsx,**/types.ts

sonar.sourceEncoding=UTF-8
