name: E2E nightly

# Extra browsers, mobile viewport, axe (again, on those engines), Chromium
# visual baselines and the base-table performance baseline. The per-PR gate
# stays Chromium-only in pr.yml.
on:
  schedule:
    # Daily, after the US evening — not on every PR.
    - cron: "17 4 * * *"
  workflow_dispatch:

# One run per ref: a new run supersedes the last on the same branch, and the
# scheduled run on main never cancels a run dispatched on another branch.
concurrency:
  group: e2e-nightly-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  showcase-build:
    name: Build the showcase and docs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-pnpm
      - name: Build
        run: pnpm turbo run build --filter=@adapttable/showcase
      - name: Build the isolated packed Vue browser consumer
        run: pnpm build:e2e:vue-consumer
      - name: Build Astro docs once for all browser projects
        run: pnpm --filter @adapttable/docs build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: showcase-dist
          path: apps/showcase/dist/
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packed-vue-consumer-dist
          path: e2e/consumers/dist/vue-native-filters/
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-dist
          path: apps/docs/dist/
          if-no-files-found: error
          retention-days: 1

  nightly-browsers:
    name: Firefox / WebKit / Pixel 5
    needs: showcase-build
    runs-on: ubuntu-latest
    # Playwright's image carries every browser build with the system libraries
    # it links against, whatever Ubuntu the runner itself is on. Keep the tag
    # on the installed @playwright/test version.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # Firefox and WebKit run the full cross-browser set, past one runner's
        # budget; each splits across two runners.
        include:
          - { project: firefox, shard: 1/2 }
          - { project: firefox, shard: 2/2 }
          - { project: webkit, shard: 1/2 }
          - { project: webkit, shard: 2/2 }
          - { project: mobile-chrome, shard: 1/1 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-pnpm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: showcase-dist
          path: apps/showcase/dist/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packed-vue-consumer-dist
          path: e2e/consumers/dist/vue-native-filters/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs-dist
          path: apps/docs/dist/
      - name: Run the nightly project
        run: pnpm exec playwright test --project=${{ matrix.project }} --shard=${{ matrix.shard }}
        env:
          SHOWCASE_SKIP_BUILD: "1"
          DOCS_SKIP_BUILD: "1"
      - name: Upload report on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-nightly-${{ matrix.project }}-${{ strategy.job-index }}
          path: playwright-report/
          retention-days: 7

  visual:
    name: Chromium visual baselines
    needs: showcase-build
    runs-on: ubuntu-latest
    # The image the Linux baselines are captured in (e2e/visual/README.md):
    # the same browser build and the same fonts, so a kit that draws with the
    # system font stack renders the pixels its baseline holds. Keep the tag on
    # the installed @playwright/test version.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-pnpm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: showcase-dist
          path: apps/showcase/dist/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packed-vue-consumer-dist
          path: e2e/consumers/dist/vue-native-filters/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs-dist
          path: apps/docs/dist/
      - name: Compare visual baselines
        run: pnpm exec playwright test --project=chromium-visual
        env:
          SHOWCASE_SKIP_BUILD: "1"
          DOCS_SKIP_BUILD: "1"
      - name: Upload report on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-nightly-visual
          path: playwright-report/
          retention-days: 7

  perf:
    name: Base-table performance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-pnpm
      - uses: ./.github/actions/playwright-chromium
      # The parse fixtures pack the built adapters, and the timings are taken
      # on the production showcase, so both are built here.
      - name: Build the packages and the showcase
        run: pnpm turbo run build --filter=@adapttable/showcase
      # Held against the runner's own baseline: a laptop's numbers say nothing
      # about a shared Linux runner. A run with no baseline writes one.
      - name: Hold the base table to its Linux baseline
        run: pnpm perf:v3 --baseline scripts/v3-perf-baseline.linux.json
      - name: Upload the measured baseline
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: v3-perf-baseline-linux
          path: scripts/v3-perf-baseline.linux.json
          if-no-files-found: ignore
          retention-days: 7
