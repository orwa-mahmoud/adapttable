<ng-template #frame let-content="content" let-grid="grid">
  <div
    [attr.data-adapttable-part]="grid ? 'grid' : null"
    style="display: contents"
  >
    <ng-container *ngTemplateOutlet="content" />
  </div>
</ng-template>
<ng-template #table let-content="content" let-attrs="attrs">
  <table
    class="table table-hover align-middle"
    data-adapttable-part="table"
    [adaptAttrs]="attrs"
  >
    <ng-container *ngTemplateOutlet="content" />
  </table>
</ng-template>
<ng-template #head let-content="content" let-style="style">
  <thead data-adapttable-part="thead" [style]="style">
    <ng-container *ngTemplateOutlet="content" />
  </thead>
</ng-template>
<ng-template #body let-content="content">
  <tbody data-adapttable-part="tbody">
    <ng-container *ngTemplateOutlet="content" />
  </tbody>
</ng-template>
<ng-template
  #row
  let-content="content"
  let-attrs="attrs"
  let-part="part"
  let-inert="inert"
  let-dragging="dragging"
  let-drop="drop"
  let-onDragOver="onDragOver"
  let-onDrop="onDrop"
>
  @if (part === "virtual-spacer") {
    <tr inert data-ng-bootstrap-part="virtual-spacer">
      <ng-container *ngTemplateOutlet="content" />
    </tr>
  } @else if (part) {
    <tr
      [adaptAttrs]="attrs"
      [attr.data-adapttable-part]="part"
      [attr.inert]="inert ? '' : null"
      [attr.data-dragging]="dragging"
      [attr.data-drop]="drop"
      (dragover)="onDragOver?.($event)"
      (drop)="onDrop?.($event)"
    >
      <ng-container *ngTemplateOutlet="content" />
    </tr>
  } @else {
    <tr
      [adaptAttrs]="attrs"
      [attr.inert]="inert ? '' : null"
      [attr.data-dragging]="dragging"
      [attr.data-drop]="drop"
      (dragover)="onDragOver?.($event)"
      (drop)="onDrop?.($event)"
    >
      <ng-container *ngTemplateOutlet="content" />
    </tr>
  }
</ng-template>
<ng-template
  #headerCell
  let-content="content"
  let-attrs="attrs"
  let-rowSpan="rowSpan"
  let-colSpan="colSpan"
  let-part="part"
  let-scope="scope"
>
  <th
    [attr.data-adapttable-part]="part"
    [attr.scope]="scope"
    [adaptAttrs]="attrs"
    [attr.rowspan]="rowSpan > 1 ? rowSpan : null"
    [attr.colspan]="colSpan"
  >
    <ng-container *ngTemplateOutlet="content" />
  </th>
</ng-template>
<ng-template #cell let-content="content" let-attrs="attrs">
  <td data-adapttable-part="cell" [adaptAttrs]="attrs">
    <ng-container *ngTemplateOutlet="content" />
  </td>
</ng-template>
<ng-template #checkbox let-attrs="attrs" let-label="label">
  <input
    [attr.aria-label]="label"
    class="form-check-input"
    data-ng-bootstrap-part="checkbox"
    [adaptAttrs]="attrs"
  />
</ng-template>
<ng-template
  #sortButton
  let-attrs="attrs"
  let-column="column"
  let-sortIndex="sortIndex"
  let-active="active"
  let-descending="descending"
>
  <button
    class="btn btn-outline-secondary btn-sm"
    data-ng-bootstrap-part="sort-button"
    [adaptAttrs]="attrs"
  >
    <span [adaptHeader]="column"></span>
    @if (sortIndex) {
      <span data-ng-bootstrap-part="sort-index">{{ sortIndex }}</span>
    }
    @if (active) {
      <span aria-hidden="true">{{ descending ? "▼" : "▲" }}</span>
    }
  </button>
</ng-template>
<ng-template #resizeHandle let-attrs="attrs">
  <span data-adapttable-part="resize-handle" [adaptAttrs]="attrs"></span>
</ng-template>
<ng-template #headerCaption let-content="content">
  <span data-adapttable-part="header-caption-control">
    <ng-container *ngTemplateOutlet="content" />
  </span>
</ng-template>
<ng-template
  #headerRename
  let-column="column"
  let-name="name"
  let-onRename="onRename"
  let-labels="labels"
  let-content="content"
>
  <adapt-column-header-rename
    [columnKey]="column.key"
    [name]="name"
    [onRename]="onRename"
    [labels]="labels"
  >
    <ng-container *ngTemplateOutlet="content" />
  </adapt-column-header-rename>
</ng-template>
<ng-template
  #rowActions
  let-row="row"
  let-actions="actions"
  let-confirm="confirm"
  let-labels="labels"
  let-layout="layout"
  let-render="render"
  let-classNames="classNames"
>
  <adapt-row-actions
    [row]="row"
    [actions]="actions"
    [confirm]="confirm"
    [labels]="labels"
    [layout]="layout"
    [render]="render"
    [classNames]="classNames"
  />
</ng-template>
<adapt-desktop-structure
  [view]="view()"
  [rowKey]="rowKey()"
  [maxHeight]="maxHeight()"
  [selectionRail]="null"
  [slots]="{
    frame: frame,
    table: table,
    head: head,
    body: body,
    row: row,
    headerCell: headerCell,
    cell: cell,
    checkbox: checkbox,
    sortButton: sortButton,
    resizeHandle: resizeHandle,
    headerCaption: headerCaption,
    headerRename: headerRename,
    rowActions: rowActions,
  }"
/>
