<ng-template #spacer let-height="height" let-className="className">
  <li
    class="adapt-material-virtual-spacer"
    [class]="className"
    style="display: block"
    [style.height.px]="height"
  ></li>
</ng-template>
<ng-template
  #checkbox
  let-attrs="attrs"
  let-label="label"
  let-className="className"
  let-rowId="rowId"
>
  <adapt-selection-checkbox
    part="checkbox"
    [className]="className"
    [attrs]="attrs"
  />
</ng-template>
<ng-template
  #rowActions
  let-row="row"
  let-actions="actions"
  let-confirm="confirm"
  let-labels="labels"
  let-layout="layout"
  let-render="render"
  let-classNames="classNames"
>
  <adapt-row-actions
    [minTargetSize]="44"
    [row]="row"
    [actions]="actions"
    [confirm]="confirm"
    [labels]="labels"
    [layout]="layout"
    [render]="render"
    [classNames]="classNames"
  />
</ng-template>
<ng-template #card let-content="content" let-summaryList="summaryList">
  @if (summaryList) {
    <ng-container *ngTemplateOutlet="content" />
  } @else {
    <mat-card style="padding: 16px">
      <ng-container *ngTemplateOutlet="content" />
    </mat-card>
  }
</ng-template>
<adapt-mobile-structure
  [view]="view()"
  [rowKey]="rowKey()"
  [maxHeight]="maxHeight()"
  [slots]="{
    spacer: spacer,
    checkbox: checkbox,
    rowActions: rowActions,
    card: card,
  }"
/>
