<!-- The keyboard grid and a transcript of its actual live regions. -->
<div class="mx-demo">
  <div class="hint-row">
    @for (hint of hints; track hint) {
      <span class="hint">{{ hint }}</span>
    }
  </div>
  <div #tableRoot class="mx-demo__body">
    <adapt-showcase-table
      tableLabel="People keyboard grid"
      [dir]="presentation.tableDir"
      [labels]="presentation.tableLabels"
      [attr.lang]="presentation.locale"
      [urlSync]="false"
      [data]="rows"
      [columns]="columns"
      [rowKey]="rowKey"
      [defaultColumnLayout]="pageLayout"
      [selectable]="true"
      [features]="features"
      [defaults]="pageDefaults"
    />
  </div>
  <div class="mx-demo__body" data-testid="announcements">
    <strong>{{ transcript.title }}</strong>
    @if (announcements().length === 0) {
      <p>{{ transcript.empty }}</p>
    } @else {
      <ol>
        @for (line of announcements(); track $index) {
          <li>{{ line }}</li>
        }
      </ol>
    }
  </div>
</div>
