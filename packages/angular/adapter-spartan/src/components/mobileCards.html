<ng-template #spacer let-height="height" let-className="className">
  <li
    data-spartan-part="virtual-spacer"
    [class]="className"
    style="display: block"
    [style.height.px]="height"
  ></li>
</ng-template>
<ng-template
  #checkbox
  let-attrs="attrs"
  let-label="label"
  let-className="className"
  let-rowId="rowId"
>
  <adapt-spartan-selection [class]="className" [attrs]="attrs" />
</ng-template>
<ng-template
  #rowActions
  let-row="row"
  let-actions="actions"
  let-confirm="confirm"
  let-labels="labels"
  let-layout="layout"
  let-render="render"
  let-classNames="classNames"
>
  <adapt-row-actions
    [minTargetSize]="44"
    [row]="row"
    [actions]="actions"
    [confirm]="confirm"
    [labels]="labels"
    [layout]="layout"
    [render]="render"
    [classNames]="classNames"
  />
</ng-template>
<adapt-mobile-structure
  [view]="view()"
  [rowKey]="rowKey()"
  [maxHeight]="maxHeight()"
  [slots]="{
    spacer: spacer,
    checkbox: checkbox,
    rowActions: rowActions,
  }"
/>
