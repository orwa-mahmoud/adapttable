packages:
  - "packages/*"
  - "apps/*"
  - "examples"
  - "starters/*"

# pnpm reads these here, NOT from the "pnpm" field in package.json — that field
# is ignored and pnpm warns about it on every command.
onlyBuiltDependencies:
  - esbuild

peerDependencyRules:
  allowedVersions:
    react: "18 || 19"
    react-dom: "18 || 19"

# Transitive dependencies pinned by their parents' ranges, forced to patched
# versions. None reach a published package — every @adapttable/* package ships
# only @adapttable/* deps plus react-compiler-runtime and
# @tanstack/react-virtual — so these are build/dev tooling only.
overrides:
  # Starters declare ^2.0.0 so StackBlitz installs from npm. The monorepo
  # must still typecheck them against workspace packages. Turbo `^build`
  # only follows a matching semver range, so each starter also names the
  # workspace `#build` it needs (see starters/*/turbo.json).
  "@adapttable/antd": "workspace:*"
  "@adapttable/base-ui": "workspace:*"
  "@adapttable/chakra": "workspace:*"
  "@adapttable/core": "workspace:*"
  "@adapttable/react": "workspace:*"
  "@adapttable/mantine": "workspace:*"
  "@adapttable/mui": "workspace:*"
  "@adapttable/radix": "workspace:*"
  "@adapttable/shadcn": "workspace:*"
  "@adapttable/unstyled": "workspace:*"
  "@adapttable/ai": "workspace:*"
  "@adapttable/ai-react": "workspace:*"
  "eslint-plugin-sonarjs>minimatch": "^10.2.3"
  # CRLF injection, cache-control disclosure, cookie injection, response
  # desync, private-cache crash
  undici: "^7.29.0"
  # host confusion via backslash authority introducer
  fast-uri: "^3.1.5"
  # sourceMappingURL path traversal → arbitrary .map disclosure
  postcss: "^8.5.23"
  # removeScripts plugin left executable scripts intact
  svgo: "^4.0.2"
  # inherited libvips CVEs (2026-33327/33328/35590/35591)
  sharp: "^0.35.0"
  # merge-key chains force quadratic CPU; 4.3.1 still burns on empty sources
  "js-yaml@3": "^3.15.0"
  "js-yaml@4": "^4.3.2"
  # DoS via exponential-time expansion of consecutive non-expanding {} groups;
  # both majors are in the tree (glob/minimatch transitives)
  "brace-expansion@1": "^1.1.16"
  "brace-expansion@5": "^5.0.7"
  # predictable output in the browser via unsanitized comment / ID
  nanoid: "^3.3.18"
  # array-limit / prototype pollution advisories; 6.15.1 is the last
  # vulnerable line Dependabot could not raise past a parent range
  qs: "^6.16.0"
