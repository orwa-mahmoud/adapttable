<ng-template #head let-content="content" let-style="style">
  <thead class="ant-table-thead" data-adapttable-part="thead" [style]="style">
    <ng-container *ngTemplateOutlet="content" />
  </thead>
</ng-template>
<ng-template #body let-content="content">
  <tbody class="ant-table-tbody" data-adapttable-part="tbody">
    <ng-container *ngTemplateOutlet="content" />
  </tbody>
</ng-template>
<ng-template
  #row
  let-content="content"
  let-attrs="attrs"
  let-part="part"
  let-inert="inert"
  let-dragging="dragging"
  let-drop="drop"
  let-onDragOver="onDragOver"
  let-onDrop="onDrop"
>
  @if (part === "virtual-spacer") {
    <tr inert>
      <ng-container *ngTemplateOutlet="content" />
    </tr>
  } @else if (part) {
    <tr
      [adaptAttrs]="withRowClass(attrs)"
      [attr.data-adapttable-part]="part"
      [attr.inert]="inert ? '' : null"
      [attr.data-dragging]="dragging"
      [attr.data-drop]="drop"
      (dragover)="onDragOver?.($event)"
      (drop)="onDrop?.($event)"
    >
      <ng-container *ngTemplateOutlet="content" />
    </tr>
  } @else {
    <tr
      [adaptAttrs]="withRowClass(attrs)"
      [attr.inert]="inert ? '' : null"
      [attr.data-dragging]="dragging"
      [attr.data-drop]="drop"
      (dragover)="onDragOver?.($event)"
      (drop)="onDrop?.($event)"
    >
      <ng-container *ngTemplateOutlet="content" />
    </tr>
  }
</ng-template>
<ng-template
  #headerCell
  let-content="content"
  let-attrs="attrs"
  let-rowSpan="rowSpan"
  let-colSpan="colSpan"
  let-part="part"
  let-scope="scope"
>
  <th
    [class.ant-table-cell]="true"
    [attr.data-adapttable-part]="part"
    [attr.scope]="scope"
    [adaptAttrs]="attrs"
    [attr.rowspan]="rowSpan > 1 ? rowSpan : null"
    [attr.colspan]="colSpan"
  >
    @if (part === "header-cell") {
      <div class="adapt-header-controls">
        <ng-container *ngTemplateOutlet="content" />
      </div>
    } @else {
      <ng-container *ngTemplateOutlet="content" />
    }
  </th>
</ng-template>
<ng-template #cell let-content="content" let-attrs="attrs">
  <td
    [class.ant-table-cell]="true"
    data-adapttable-part="cell"
    [adaptAttrs]="attrs"
  >
    <ng-container *ngTemplateOutlet="content" />
  </td>
</ng-template>
<ng-template #checkbox let-attrs="attrs">
  <adapt-selection-checkbox [attrs]="attrs" />
</ng-template>
<ng-template
  #sortButton
  let-attrs="attrs"
  let-column="column"
  let-sortIndex="sortIndex"
  let-active="active"
  let-descending="descending"
>
  <button nz-button nzType="text" nzSize="small" [adaptAttrs]="attrs">
    <span [adaptHeader]="column"></span>
    @if (sortIndex) {
      <span>{{ sortIndex }}</span>
    }
    @if (active) {
      <span aria-hidden="true">{{ descending ? "▼" : "▲" }}</span>
    }
  </button>
</ng-template>
<ng-template #resizeHandle let-attrs="attrs">
  <button
    nz-button
    nzType="text"
    type="button"
    data-adapttable-part="resize-handle"
    [adaptAttrs]="attrs"
  ></button>
</ng-template>
<ng-template #headerCaption let-content="content">
  <span data-adapttable-part="header-caption-control">
    <ng-container *ngTemplateOutlet="content" />
  </span>
</ng-template>
<ng-template
  #headerRename
  let-column="column"
  let-name="name"
  let-onRename="onRename"
  let-labels="labels"
  let-content="content"
>
  <adapt-column-header-rename
    [columnKey]="column.key"
    [name]="name"
    [onRename]="onRename"
    [labels]="labels"
  >
    <ng-container *ngTemplateOutlet="content" />
  </adapt-column-header-rename>
</ng-template>
<ng-template
  #rowActions
  let-row="row"
  let-actions="actions"
  let-confirm="confirm"
  let-labels="labels"
  let-layout="layout"
  let-render="render"
  let-classNames="classNames"
>
  <adapt-row-actions
    [row]="row"
    [actions]="actions"
    [confirm]="confirm"
    [labels]="labels"
    [layout]="layout"
    [render]="render"
    [classNames]="classNames"
  />
</ng-template>
<adapt-desktop-structure
  #structure
  [view]="view()"
  [rowKey]="rowKey()"
  [maxHeight]="maxHeight()"
  [selectionRail]="null"
  [embedded]="true"
  slotInjector="outlet"
  [slots]="{
    head: head,
    body: body,
    row: row,
    headerCell: headerCell,
    cell: cell,
    checkbox: checkbox,
    sortButton: sortButton,
    resizeHandle: resizeHandle,
    headerCaption: headerCaption,
    headerRename: headerRename,
    rowActions: rowActions,
  }"
/>
<div #scrollBox data-adapttable-part="scroll-box" [style]="scrollStyle()">
  <nz-table
    adaptZorroTable
    [nzTemplateMode]="true"
    [nzFrontPagination]="false"
    [nzShowPagination]="false"
    [nzSize]="view().density() === 'compact' ? 'small' : 'default'"
    [attr.data-adapttable-part]="
      tableAttrs()['role'] === 'grid' ? 'grid' : null
    "
    [adaptAttrs]="tableAttrs()"
    [adaptAttrsTarget]="tableElement"
  >
    @if (structure.bodyTemplate(); as rows) {
      <ng-container
        [ngTemplateOutlet]="rows"
        ngTemplateOutletInjector="outlet"
      />
    }
  </nz-table>
</div>
