<!doctype html>
<!--
  Per-page Open Graph card generator. Each .card is exactly 1200x630 (the OG
  spec). Regenerate the PNGs by opening this file and screenshotting each
  card element (id="c-<slug>") into ../public/og/<slug>.png. No build
  dependency — the cards are static HTML screenshotted locally.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      * {
        margin: 0;
        box-sizing: border-box;
      }
      body {
        background: #0b0c1a;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
      }
      .card {
        width: 1200px;
        height: 630px;
        position: relative;
        overflow: hidden;
        background:
          radial-gradient(
            120% 90% at 12% 8%,
            rgba(108, 92, 231, 0.35),
            transparent 55%
          ),
          radial-gradient(
            90% 90% at 100% 100%,
            rgba(108, 92, 231, 0.18),
            transparent 50%
          ),
          #0d0e1f;
        color: #fff;
        padding: 72px 76px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .brand svg {
        display: block;
      }
      .brand span {
        font-size: 30px;
        font-weight: 500;
        letter-spacing: -0.02em;
      }
      .brand b {
        font-weight: 800;
      }
      .body {
        display: flex;
        flex-direction: column;
        gap: 22px;
      }
      .kicker {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #a89bff;
      }
      .title {
        font-size: 76px;
        font-weight: 800;
        line-height: 1.04;
        letter-spacing: -0.03em;
        max-width: 1000px;
        text-wrap: balance;
      }
      .title.long {
        font-size: 60px;
      }
      .foot {
        display: flex;
        align-items: center;
        gap: 18px;
        font-size: 24px;
        color: #b9bad0;
      }
      .dots {
        display: flex;
        gap: 9px;
      }
      .dots i {
        width: 15px;
        height: 15px;
        border-radius: 50%;
        display: block;
      }
      .bar {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 8px;
        background: linear-gradient(90deg, #6c5ce7, #a89bff 60%, transparent);
      }
    </style>
  </head>
  <body>
    <div id="cards"></div>
    <script>
      const LOGO = `<svg width="40" height="40" viewBox="0 0 32 32" aria-hidden="true">
        <rect x="8.5" y="1.5" width="22" height="22" rx="5.5" fill="#6c5ce7" opacity="0.28"/>
        <rect x="5" y="5" width="22" height="22" rx="5.5" fill="#6c5ce7" opacity="0.55"/>
        <rect x="1.5" y="8.5" width="22" height="22" rx="5.5" fill="#6c5ce7"/>
        <rect x="4.5" y="12.5" width="16" height="2.8" rx="1.2" fill="#fff"/>
        <rect x="11.1" y="12.5" width="2.8" height="14.5" rx="1.2" fill="#fff"/>
      </svg>`;
      const KITS = [
        "#4c6ef5",
        "#5b52d6",
        "#12b5b0",
        "#5b6ef5",
        "#111827",
        "#8b5cf6",
      ];
      const DOTS = KITS.map((c) => `<i style="background:${c}"></i>`).join("");
      const PAGES = [
        ["getting-started", "Getting started", "Start"],
        ["concepts", "Concepts", "Start"],
        ["data-tiers", "Data tiers", "Start"],
        ["columns", "Columns", "Features"],
        ["sparkline", "Sparkline columns", "Features"],
        ["sorting", "Sorting", "Features"],
        ["filtering", "Filtering", "Features"],
        ["pagination", "Pagination", "Features"],
        ["selection", "Selection & bulk actions", "Features"],
        ["row-expansion", "Row expansion", "Features"],
        ["cell-editing", "Inline cell editing", "Features"],
        ["row-reordering", "Row reordering", "Features"],
        ["row-pinning", "Row pinning", "Features"],
        ["pinned-summary-rows", "Pinned summary rows", "Features"],
        ["row-spanning", "Row and column spanning", "Features"],
        ["full-width-rows", "Full-width and separator rows", "Features"],
        ["row-styling", "Row styling and heights", "Features"],
        ["row-grouping", "Row grouping", "Features"],
        ["column-management", "Column management", "Features"],
        ["saved-views", "Saved views", "Features"],
        ["virtualization", "Virtualization", "Features"],
        ["url-state", "URL state", "Beyond the table"],
        ["customization", "Customization", "Beyond the table"],
        ["i18n-rtl", "i18n & RTL", "Beyond the table"],
        ["api", "API reference", "Reference"],
        ["faq", "FAQ", "Reference"],
        [
          "comparison",
          "AdaptTable vs ag-Grid, MUI X & TanStack Table",
          "Reference",
        ],
        ["versioning", "Versioning & stability", "Reference"],
      ];
      document.getElementById("cards").innerHTML = PAGES.map(
        ([slug, title, kicker]) => `
        <div class="card" id="c-${slug}">
          <div class="brand">${LOGO}<span>Adapt<b>Table</b></span></div>
          <div class="body">
            <div class="kicker">${kicker}</div>
            <div class="title${title.length > 28 ? " long" : ""}">${title}</div>
          </div>
          <div class="foot">
            <div class="dots">${DOTS}</div>
            <span>Headless React data table · one API, every UI kit</span>
          </div>
          <div class="bar"></div>
        </div>`
      ).join("");
    </script>
  </body>
</html>
