name: Site

# Builds the composed site (docs + showcase) and every redirect that keeps its
# previous addresses working. A pull request builds and checks it; a push to
# main also deploys it:
#   - the site to Cloudflare Pages, served at the origin in scripts/site.mjs,
#     then an IndexNow ping for the pages that changed;
#   - the redirect-only site to GitHub Pages, answering at the previous
#     address — once the repository variable LEGACY_REDIRECTS is "true".
#     Until then GitHub Pages keeps its last deployment.

on:
  push:
    branches: [main]
    paths:
      - "apps/docs/**"
      - "apps/showcase/**"
      - "packages/**"
      - "docs/**"
      - "llms.txt"
      - "llms-full.txt"
      - "scripts/site.mjs"
      - "scripts/legacy-routes.mjs"
      - "scripts/build-redirects.mjs"
      - "scripts/check-site-links.mjs"
      - "scripts/sitemap-routes.mjs"
      - "scripts/check-sitemap.mjs"
      - "scripts/build-llms-full.mjs"
      - "scripts/indexnow.mjs"
      - "scripts/indexnow-delta.mjs"
      - "scripts/build-showcase-html.mjs"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/site.yml"
  pull_request:
    paths:
      - "apps/docs/**"
      - "apps/showcase/**"
      - "packages/**"
      - "docs/**"
      - "llms.txt"
      - "llms-full.txt"
      - "scripts/site.mjs"
      - "scripts/legacy-routes.mjs"
      - "scripts/build-redirects.mjs"
      - "scripts/check-site-links.mjs"
      - "scripts/sitemap-routes.mjs"
      - "scripts/check-sitemap.mjs"
      - "scripts/build-llms-full.mjs"
      - "scripts/indexnow.mjs"
      - "scripts/indexnow-delta.mjs"
      - "scripts/build-showcase-html.mjs"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-pnpm
      - name: Build packages
        run: pnpm -r --filter './packages/*' build
      - name: Build docs site
        run: pnpm --filter @adapttable/docs build
      - name: Build live demo (showcase)
        run: pnpm --filter @adapttable/showcase build
      - name: Compose site (showcase under /react/demo)
        run: |
          mkdir -p apps/docs/dist/react/demo
          cp -R apps/showcase/dist/* apps/docs/dist/react/demo/
      - name: Check every demo route is in the sitemap
        run: pnpm check:sitemap
      - name: Check every same-site link resolves
        run: node scripts/check-site-links.mjs
      - name: Write the redirects for the previous addresses
        run: node scripts/build-redirects.mjs --legacy legacy-site
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: composed-site
          path: apps/docs/dist
          retention-days: 1
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: legacy-site

  deploy:
    name: Deploy to Cloudflare Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-pages
      url: https://adapttable.orwamahmoud.com/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: composed-site
          path: apps/docs/dist
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >
          npx --yes wrangler@4.136.3 pages deploy apps/docs/dist
          --project-name=adapttable --branch=main

  indexnow:
    name: Notify IndexNow
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: composed-site
          path: apps/docs/dist
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .indexnow-state.json
          key: indexnow-${{ github.sha }}
          restore-keys: |
            indexnow-
      - name: Notify IndexNow of changed URLs
        run: node scripts/indexnow.mjs --dist apps/docs/dist --state .indexnow-state.json
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always()
        with:
          path: .indexnow-state.json
          key: indexnow-${{ github.sha }}

  legacy-redirects:
    name: Deploy the previous address's redirects to GitHub Pages
    if: >
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      vars.LEGACY_REDIRECTS == 'true'
    needs: [build, deploy]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
