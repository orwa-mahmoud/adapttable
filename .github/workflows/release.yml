name: Release

on:
  push:
    branches: [main]
  # Manual recovery when GitHub drops a push event.
  workflow_dispatch:

concurrency: release-${{ github.ref }}

# Nothing at this level: a token declared here reaches every job, including
# ones that only read. Each job below asks for what it needs.
permissions: {}

jobs:
  # Skip cleanly until an NPM_TOKEN secret is configured, so pushes don't fail
  # before the project is set up to publish. Add the secret (Settings →
  # Secrets → Actions → NPM_TOKEN) and this activates automatically.
  guard:
    runs-on: ubuntu-latest
    # Reads one secret's presence and writes a boolean to an output. It needs
    # no access to the repository at all.
    permissions: {}
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        run: echo "enabled=${{ secrets.NPM_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

  detect:
    name: Detect
    needs: guard
    if: ${{ needs.guard.outputs.enabled == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      needVersion: ${{ steps.flags.outputs.needVersion }}
      needPublish: ${{ steps.flags.outputs.needPublish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: flags
        name: Classify version vs publish vs skip
        run: node scripts/release-detect.mjs >> "$GITHUB_OUTPUT"

  release:
    needs: [guard, detect]
    if: >
      needs.guard.outputs.enabled == 'true' &&
      (needs.detect.outputs.needVersion == 'true' ||
       needs.detect.outputs.needPublish == 'true')
    name: Version or Publish
    runs-on: ubuntu-latest
    # contents: tag and commit the version bump · id-token: npm provenance on
    # publish. The "Version Packages" PR is opened with RELEASE_TOKEN, so the
    # workflow token needs no pull-requests access.
    permissions:
      contents: write
      id-token: write
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create release PR or publish
        uses: changesets/action@198f833dd7d863100ea6e28967bc9a9fdefadb0a # v2.1.0
        with:
          # Detect already decided a version PR or an unpublished package
          # exists. Publish is build → publint → changeset publish — not
          # verify:release. ONE command: the action execs its publish input
          # without a shell, so a `&&` here would be a literal argument.
          publish-script: pnpm release:gated
          version-script: pnpm version-packages
          # A fine-grained PAT scoped to this repository alone, with Contents
          # and Pull requests write and nothing else. Repository settings deny
          # the workflow token the ability to create pull requests, so this is
          # the identity that opens the "Version Packages" PR — and because it
          # is a real account, that PR runs the required checks.
          github-token: ${{ secrets.RELEASE_TOKEN }}
        env:
          # npm auth for `changeset publish`: setup-node's registry-url writes
          # the .npmrc that reads this variable.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # The version-bump commit must not run the husky gate on this
          # 2-core runner: CI enforces the same gate on every PR (including
          # the Version Packages PR), and the full suite inside a commit
          # hook starves past the 30s antd test budget.
          HUSKY: "0"
