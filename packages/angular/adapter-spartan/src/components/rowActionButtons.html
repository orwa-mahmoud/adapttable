@let content = renderer();
@if (content?.template; as template) {
  <ng-container
    [ngTemplateOutlet]="template"
    [ngTemplateOutletContext]="context()"
  />
} @else if (content?.component; as component) {
  <ng-container
    [ngComponentOutlet]="component"
    [ngComponentOutletInputs]="content?.inputs"
  />
} @else if (layout() === "menu") {
  <div
    brnPopover
    [adaptHlmPopoverLabel]="labels().rowActionsMenu"
    #menu="brnPopover"
    data-adapttable-part="row-actions-menu"
    [class]="classNames().rowActionsMenu"
    (pointerdown)="$event.stopPropagation()"
  >
    <button
      adaptHlmButton
      brnPopoverTrigger
      data-adapttable-part="row-actions-trigger"
      [class]="classNames().rowActionsTrigger"
      [attr.aria-label]="labels().rowActionsMenu"
      (click)="$event.stopPropagation()"
    >
      ⋮</button
    ><ng-template brnPopoverContent
      ><div
        class="at-spartan-surface at-spartan-popover"
        data-adapttable-kit="spartan"
      >
        @for (item of items(); track item.action.key) {
          <button
            adaptHlmButton
            type="button"
            data-adapttable-part="action-button"
            [class]="classNames().actionButton"
            [attr.aria-label]="item.action.label"
            [attr.title]="item.reason ?? null"
            [attr.data-color]="item.action.color ?? null"
            [disabled]="item.disabled"
            (click)="run($event, item.action)"
          >
            {{ item.action.label }}
          </button>
        }
      </div></ng-template
    >
  </div>
} @else {
  @for (item of items(); track item.action.key) {
    <button
      adaptHlmButton
      type="button"
      data-adapttable-part="action-button"
      [class]="classNames().actionButton"
      [attr.aria-label]="item.action.label"
      [attr.title]="item.reason ?? null"
      [attr.data-color]="item.action.color ?? null"
      [disabled]="item.disabled"
      (click)="run($event, item.action)"
    >
      {{ item.action.label }}
    </button>
  }
}
