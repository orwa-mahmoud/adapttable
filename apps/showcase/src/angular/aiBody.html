<div class="mx-demo ai-demo" [attr.dir]="direction">
  <p class="hint">
    This local demo needs no model or API key. Sort salaries, choose a person,
    or propose Grace's salary as 150. Writes wait for your decision.
  </p>
  <div class="angular-ai-controls">
    <adapt-showcase-action [props]="showEveryone()" />
    <div class="angular-ai-choice">
      <span>Approval surface</span>
      <adapt-showcase-choice [props]="surfaceChoice()" />
    </div>
  </div>
      <adapt-showcase-table
        [dir]="presentation.dir"
        [labels]="presentation.labels"
        [attr.lang]="presentation.locale"
        tableLabel="AI people"
        [data]="rows()"
        [columns]="columns"
        [rowKey]="rowKey"
        [urlSync]="false"
        [defaults]="{ limit: 10 }"
        [features]="features"
      />
      <p class="hint" role="status" data-demo-log>{{ log() }}</p>
    <adapt-showcase-assistant [props]="assistantProps()" />
</div>
